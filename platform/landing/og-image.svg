<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#ececef"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Soft glow behind mark -->
  <circle cx="600" cy="240" r="180" fill="url(#glow)"/>

  <!-- Brand mark (large breathing core) -->
  <circle cx="600" cy="240" r="84" fill="#0a0a0a"/>
  <circle cx="600" cy="240" r="32" fill="#fafafa"/>

  <!-- Wordmark -->
  <text x="600" y="420" font-family="Geist, -apple-system, Helvetica, sans-serif" font-size="84" font-weight="300" letter-spacing="-3" text-anchor="middle" fill="#0a0a0a">Livinity</text>

  <!-- Tagline -->
  <text x="600" y="490" font-family="Geist, -apple-system, Helvetica, sans-serif" font-size="28" font-weight="400" letter-spacing="-0.5" text-anchor="middle" fill="#6e6e73">Your own Cloud AI Computer.</text>

  <!-- Bottom row meta -->
  <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" font-weight="500" letter-spacing="2" fill="#737373">
    <text x="600" y="570" text-anchor="middle">OPEN-SOURCE · SELF-HOST · PRIVATE BY DEFAULT</text>
  </g>

  <!-- Subtle URL bottom-right -->
  <text x="1140" y="600" font-family="Geist Mono, ui-monospace, monospace" font-size="13" text-anchor="end" fill="#a1a1a6">livinity.io</text>
</svg>
