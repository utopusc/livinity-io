<html lang="en">

    <style>
      :root { --dash-radius: 18px; --dash-line: rgba(0,0,0,0.07); --dash-line-strong: rgba(0,0,0,0.12); --card-bg: #ffffff; --card-bg-2: #fafafa; --card-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 24px 60px -34px rgba(0,0,0,0.18); --accent-green: #16a34a; --accent-amber: #d97706; --accent-red: #dc2626; --font-mono: "Geist Mono", ui-monospace, monospace; --font-serif: "Instrument Serif", serif; }
      body.dark { --dash-line: rgba(255,255,255,0.08); --dash-line-strong: rgba(255,255,255,0.16); --card-bg: #0f0f11; --card-bg-2: #08080a; --card-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 24px 60px -28px rgba(0,0,0,0.8); }

      .url-preview code { font-family: var(--font-mono); color: var(--fg); }

      .availability { font-size: 12px; font-family: var(--font-mono); min-height: 18px; margin-top: 2px; color: var(--fg-faint); }
      .availability.err { color: var(--accent-red); }

      .cmd-box { background: var(--card-bg-2); border: 1px solid var(--dash-line); border-radius: 12px; padding: 16px; font-family: var(--font-mono); font-size: 12.5px; word-break: break-all; line-height: 1.55; color: var(--fg); position: relative; }
      .cmd-box .copy { position: absolute; top: 12px; right: 12px; font-size: 11px; padding: 5px 10px; }
      .cmd-box code { display: block; padding-right: 104px; }

      /* Copy button — confirmed "Copied" state so the click is unmistakable */
      .copy-btn { display: inline-flex; align-items: center; gap: 6px; }
      .copy-btn .cico { display: inline-flex; width: 13px; height: 13px; flex-shrink: 0; }
      .copy-btn .cico svg { width: 13px; height: 13px; display: block; }
      .copy-btn.is-copied, .copy-btn.is-copied:hover { background: var(--accent-green); border-color: var(--accent-green); color: #fff; opacity: 1; }
      @keyframes copyPop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }
      .copy-btn.is-copied .cico { animation: copyPop 0.28s ease; }
      @media (prefers-reduced-motion: reduce) { .copy-btn.is-copied .cico { animation: none; } }

      /* Neutral explainer note (calm, not a warning) */
      .info-note { background: var(--card-bg-2); border: 1px solid var(--dash-line); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: var(--fg-mute); line-height: 1.55; margin-bottom: 16px; }
      .info-note code { font-family: var(--font-mono); font-size: 0.92em; color: var(--fg); }

      /* "Run the install" — set apart from the Cloudflare setup steps */
      .install-run { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--dash-line); }

      .next-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
      .next-list li { display: flex; gap: 12px; align-items: flex-start; font-size: 13.5px; color: var(--fg); line-height: 1.5; }
      .next-list .n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; background: var(--card-bg-2); border: 1px solid var(--dash-line-strong); font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--fg-mute); display: flex; align-items: center; justify-content: center; margin-top: 1px; }

      .warn-card { background: rgba(217,119,6,0.06); border: 1px solid rgba(217,119,6,0.25); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: var(--accent-amber); margin-bottom: 14px; line-height: 1.5; }

      /* Free (BYO domain + Cloudflare) input fields */
      .byod-field { margin-bottom: 14px; }
      .byod-field label { display: block; font-size: 12px; font-family: var(--font-mono); color: var(--fg-mute); margin-bottom: 6px; }
      .byod-field label .hint { color: var(--fg-faint); text-transform: none; }
      .byod-field input { width: 100%; box-sizing: border-box; background: var(--card-bg-2); border: 1px solid var(--dash-line); border-radius: 10px; padding: 11px 13px; font-family: var(--font-mono); font-size: 12.5px; color: var(--fg); transition: border-color 0.15s ease; }
      .byod-field input:focus { outline: none; border-color: var(--dash-line-strong); }
      .byod-field input::placeholder { color: var(--fg-faint); }
      .byod-field.inline { margin: 2px 0 0; }

      /* Cloudflare setup guide (free / BYO domain) */
      .next-list.cf-steps > li { align-items: flex-start; }
      .step-body { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
      .step-body .lead { font-size: 13.5px; color: var(--fg); line-height: 1.5; }
      .step-body code { font-family: var(--font-mono); font-size: 0.92em; }
      .step-note { font-size: 12px; color: var(--fg-faint); line-height: 1.5; }
      .step-note.warn { color: var(--accent-amber); }
      .step-kv { background: var(--card-bg-2); border: 1px solid var(--dash-line); border-radius: 9px; padding: 9px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--fg); display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; align-items: baseline; margin: 0; }
      .step-kv dt { color: var(--fg-faint); }
      .step-kv dd { margin: 0; color: var(--fg); font-weight: 500; }
      .scope-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
      .scope-list li { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg); background: var(--card-bg-2); border: 1px solid var(--dash-line); border-radius: 8px; padding: 7px 10px; display: flex; gap: 8px; align-items: center; }
      .scope-list .tick { color: var(--accent-green); flex-shrink: 0; font-weight: 700; }

      .nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding: 0 4px; }
      .nav-row .right { display: flex; gap: 10px; }

      .install-loading { min-height: 100vh; display: grid; place-items: center; color: var(--fg-mute); font-family: var(--font-mono); font-size: 14px; }

      @media (max-width: 480px) { .install-shell { padding: 16px 14px 60px; } .install-nav .right { gap: 8px; } .panel { padding: 20px 18px; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="install-loading"><p>Loading…</p></div></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Returns true only when the text actually made it to the clipboard, so
      // the button can show a confirmed "Copied" state. Falls back to a hidden
      // textarea + execCommand when the async Clipboard API is unavailable
      // (older browsers, or a non-secure context).
      async function copyText(s) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(s);
            return true;
          }
        } catch (e) {}
        try {
          const ta = document.createElement("textarea");
          ta.value = s;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-1000px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (e) { return false; }
      }

      const IconClipboard = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" />
        </svg>
      );
      const IconCheck = () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M5 13l4 4L19 7" />
        </svg>
      );

      // One copy button with a visible, confirmed "Copied" state (green + a
      // checkmark that pops in), so it's unambiguous the click landed. Resets
      // after ~1.8s. Used for every copyable command on the page.
      function CopyButton(props) {
        const [copied, setCopied] = useState(false);
        const timerRef = useRef(null);
        useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);
        async function onCopy() {
          const ok = await copyText(props.text);
          if (!ok) return;
          setCopied(true);
          if (timerRef.current) clearTimeout(timerRef.current);
          timerRef.current = setTimeout(() => setCopied(false), 1800);
        }
        const cls =
          "copy-btn h-btn solid" +
          (props.extraClass ? " " + props.extraClass : "") +
          (copied ? " is-copied" : "");
        return (
          <button type="button" className={cls} onClick={onCopy} disabled={props.disabled} aria-live="polite">
            <span className="cico">{copied ? <IconCheck /> : <IconClipboard />}</span>
            <span>{copied ? "Copied" : (props.label || "Copy")}</span>
          </button>
        );
      }

      // Split the box address the user types (e.g. "liv.bruceoz.com") into the
      // subdomain label ("liv") and the registrable zone ("bruceoz.com").
      // The zone is what they add to Cloudflare; the label + zone are the exact
      // values the tunnel's Public Hostname form wants. Requires >= 3 labels
      // (a sub label + a registrable domain). This first-label split is correct
      // for the intended shape <sub>.<registrable-domain> — including multi-part
      // TLDs like liv.example.co.uk — but without a public-suffix list it can't
      // catch a mistyped bare multi-part zone (example.co.uk) or over-nesting
      // (a.b.example.com); Step 1 visibly echoes the derived zone so the user
      // can sanity-check it before adding it to Cloudflare.
      function splitDomain(raw) {
        const host = (raw || "")
          .trim()
          .toLowerCase()
          .replace(/^https?:\/\//, "")
          .replace(/\/.*$/, "")
          .replace(/\.$/, "");
        const parts = host.split(".").filter(Boolean);
        if (parts.length < 3) return { host: host, sub: "", domain: "", ok: false };
        return { host: host, sub: parts[0], domain: parts.slice(1).join("."), ok: true };
      }

      // The full one-time Cloudflare walkthrough for the free / BYO-domain tier.
      // Every step is done BEFORE install (including the box's own public
      // hostname), so once the command finishes the box URL just works with no
      // post-install Cloudflare step. The CF tokens are typed here and only ever
      // leave the page inside the assembled command — never POSTed to Livinity.
      function CfSetupGuide(props) {
        const p = splitDomain(props.domain);
        // When the address is empty or invalid, EVERY derived value falls back
        // to the same placeholders (never the raw typed value) so the callout,
        // steps, and command can never disagree with each other.
        const host = p.ok ? p.host : "liv.yourdomain.com";
        const sub = p.ok ? p.sub : "liv";
        const zone = p.ok ? p.domain : "yourdomain.com";
        const appExample = "<app>-" + host;
        const showAddrErr = !p.ok && props.domain.trim().length > 0;

        return (
          <div>
            <h2>Cloudflare setup</h2>
            <p className="sub">Four one-time steps in Cloudflare, all before you install — then your box comes up already reachable. Your Cloudflare tokens stay in this browser; only the finished command leaves it.</p>

            <div className="byod-field">
              <label htmlFor="byod-box-addr">Box address <span className="hint">— one label under your domain, e.g. liv.yourdomain.com</span></label>
              <input id="byod-box-addr" type="text" value={props.domain} onChange={(e) => props.setDomain(e.target.value)} placeholder="liv.yourdomain.com" autoComplete="off" spellCheck={false} />
              {p.ok && (
                <div className="url-preview" style={{ marginTop: 8 }}>
                  Box → <code>{"https://" + host}</code> &nbsp;·&nbsp; apps → <code>{appExample}</code>
                </div>
              )}
              {showAddrErr && (
                <p className="availability err" style={{ marginTop: 6 }}>Use the full address, one label under your domain — like <code>liv.yourdomain.com</code>. A bare <code>yourdomain.com</code> won't work.</p>
              )}
            </div>

            <div className="info-note">
              Your box lives at <code>{host}</code> and each app at <code>{appExample}</code> — every address is one label under <code>{zone}</code>, so Cloudflare's free SSL covers them all. Apps use a hyphen because a two-level name like <code>app.{host}</code> gets no free certificate.
            </div>

            <ol className="next-list cf-steps">
              <li>
                <span className="n">1</span>
                <div className="step-body">
                  <span className="lead">Add <strong>{zone}</strong> to Cloudflare — <em>Websites → Add a site</em> — and point your registrar's nameservers at the two it gives you. The Free plan is fine.</span>
                  <span className="step-note">Wait for the zone to read <strong>Active</strong>. <code>dig NS {zone}</code> should return <code>*.ns.cloudflare.com</code>.</span>
                </div>
              </li>
              <li>
                <span className="n">2</span>
                <div className="step-body">
                  <span className="lead">In <strong>Zero Trust → Networks → Tunnels</strong>, create a <strong>Cloudflared</strong> tunnel and copy its connector token from the <em>Install connector</em> screen.</span>
                  <div className="byod-field inline">
                    <label htmlFor="byod-tunnel-token">Tunnel token</label>
                    <input id="byod-tunnel-token" type="password" value={props.cfTunnelToken} onChange={(e) => props.setCfTunnelToken(e.target.value)} placeholder="eyJ…" autoComplete="off" spellCheck={false} />
                  </div>
                  <span className="step-note">Create it from the dashboard, not a local <code>config.yml</code> — each app routes through it automatically.</span>
                </div>
              </li>
              <li>
                <span className="n">3</span>
                <div className="step-body">
                  <span className="lead">In that tunnel's <strong>Public Hostname</strong> tab, add one hostname pointing your box's address at its UI:</span>
                  <dl className="step-kv">
                    <dt>Subdomain</dt><dd>{sub}</dd>
                    <dt>Domain</dt><dd>{zone}</dd>
                    <dt>Type</dt><dd>HTTP</dd>
                    <dt>URL</dt><dd>localhost:80</dd>
                  </dl>
                  <span className="step-note">The only route you add by hand. It reads <em>down</em> until the box connects during install, then <code>{"https://" + host}</code> goes live — apps add their own routes after that.</span>
                </div>
              </li>
              <li>
                <span className="n">4</span>
                <div className="step-body">
                  <span className="lead">In <strong>My Profile → API Tokens</strong>, create a custom token with three permissions:</span>
                  <ul className="scope-list">
                    <li><span className="tick">✓</span> Account · Cloudflare Tunnel · Edit</li>
                    <li><span className="tick">✓</span> Zone · DNS · Edit</li>
                    <li><span className="tick">✓</span> Zone · Zone · Read</li>
                  </ul>
                  <span className="lead">Scope it to your account and <strong>{zone}</strong>, then copy the token value.</span>
                  <div className="byod-field inline">
                    <label htmlFor="byod-api-token">API token</label>
                    <input id="byod-api-token" type="password" value={props.cfApiToken} onChange={(e) => props.setCfApiToken(e.target.value)} placeholder="Cloudflare API token" autoComplete="off" spellCheck={false} />
                  </div>
                  <span className="step-note">All three matter — the <strong>Cloudflare Tunnel</strong> permission is the one people miss. A new token has a new value; editing an existing one keeps it.</span>
                </div>
              </li>
            </ol>

            <div className="install-run">
              <h2>Run the install</h2>
              <p className="sub">Paste this on a fresh Ubuntu 24.04 / Debian 12 machine (~5–8 min). When it finishes, open <code style={{ fontFamily: "var(--font-mono)" }}>{"https://" + host}</code> — nothing else to set up.</p>

              <div className="warn-card">
                Your API key appears once. Lose it and you'll need <strong>Regenerate</strong> below — which invalidates the old one.
              </div>

              <div className="cmd-box" style={{ marginBottom: 10, whiteSpace: "pre-wrap" }}>
                <CopyButton text={props.byodCmd} extraClass="copy" disabled={!props.byodReady} label={props.byodReady ? "Copy" : "Fill in"} />
                <code>{props.byodCmd}</code>
              </div>
              {!props.byodReady && (
                <p className="availability" style={{ marginBottom: 6 }}>Fill in your box address and both Cloudflare tokens above to complete the command.</p>
              )}

              <p className="step-note" style={{ marginTop: 12 }}>
                After install, each app you add gets <code>{appExample}</code> with its own SSL, created on your Cloudflare zone automatically. Uninstalling removes it.
              </p>
            </div>
          </div>
        );
      }

      function App() {
        useEffect(() => {
          try {
            const saved = localStorage.getItem("liv_theme");
            if (saved === "dark") document.body.classList.add("dark");
          } catch (e) {}
        }, []);

        const [user, setUser] = useState(null);
        const [authLoading, setAuthLoading] = useState(true);
        const [gen, setGen] = useState({ status: "idle" });

        // Free (BYO domain + Cloudflare) tier: the user supplies their own domain
        // + CF tokens here, and the install command is assembled in the browser —
        // the CF tokens NEVER get POSTed to livinity.io.
        const [byod, setByod] = useState(false);
        const [byodDomain, setByodDomain] = useState("");
        const [cfApiToken, setCfApiToken] = useState("");
        const [cfTunnelToken, setCfTunnelToken] = useState("");

        // Bootstrap auth + immediately mint API key in one mount-time flow.
        useEffect(() => {
          (async () => {
            try {
              const me = await fetch("/api/auth/me", { credentials: "same-origin" });
              if (!me.ok) { window.location.href = "/login?redirect=/dashboard/install"; return; }
              const meData = await me.json();
              if (!meData.user) { window.location.href = "/login?redirect=/dashboard/install"; return; }
              // Phase 140-06.2: block unverified users from the install wizard.
              // Send them to /verify (pending state) until they click the email link.
              if (!meData.user.emailVerified) {
                window.location.href = "/verify";
                return;
              }
              setUser(meData.user);
              setAuthLoading(false);

              // Phase 140-06.4: check whether user already has an API key BEFORE
              // auto-minting. Without this check, every page reload deletes the
              // existing key + mints a new one — which silently invalidates the
              // install command the user already pasted onto their Mini PC.
              const dashRes = await fetch("/api/dashboard", { credentials: "same-origin" });
              let dashData = await dashRes.json().catch(() => ({}));

              // Free BYO-domain account? (plan 'free' AND not a grandfathered
              // legacy_free — the latter keeps the managed .livinity.io flow.)
              const isByod = !!(dashData && dashData.billing && dashData.billing.plan === "free" && !dashData.billing.legacyFree);
              setByod(isByod);

              // Billing gate: minting requires an active trial/subscription.
              // Fresh from Stripe Checkout (?checkout=success) the webhook can
              // lag — POST /api/billing/sync pulls state straight from Stripe
              // (webhook-independent), so we don't depend on a delivered event.
              if (dashData && dashData.billing && !dashData.billing.active) {
                const justCheckedOut =
                  new URLSearchParams(window.location.search).get("checkout") === "success";
                let billingOk = false;
                if (justCheckedOut) {
                  setGen({ status: "minting" });
                  for (let i = 0; i < 12; i++) {
                    const sync = await fetch("/api/billing/sync", { method: "POST", credentials: "same-origin" });
                    const sd = await sync.json().catch(() => ({}));
                    if (sd && sd.active) { billingOk = true; break; }
                    await new Promise((r) => setTimeout(r, 2500));
                  }
                }
                if (!billingOk) {
                  // A user who JUST paid must never be bounced back to pricing —
                  // show a "setup in progress" state they can retry instead.
                  if (justCheckedOut) {
                    setGen({ status: "billing_pending" });
                    return;
                  }
                  window.location.href = "/pricing";
                  return;
                }
              }

              if (dashData && dashData.apiKey && dashData.apiKey.hasKey) {
                setGen({
                  status: "exists",
                  keyPrefix: dashData.apiKey.prefix,
                  username: meData.user.username,
                });
                return;
              }

              // No key yet — auto-mint on this first visit.
              setGen({ status: "minting" });
              const res = await fetch("/api/dashboard", {
                method: "POST", credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "generate-key" }),
              });
              const body = await res.json().catch(() => ({}));
              if (!res.ok || !body.apiKey) {
                if (body.error === "subscription_required") { window.location.href = "/pricing"; return; }
                setGen({ status: "error", error: body.error || ("HTTP " + res.status) });
                return;
              }
              setGen({
                status: "ready",
                apiKey: body.apiKey,
                installCommand: body.installCommand,
                username: body.username || meData.user.username,
              });
            } catch (e) {
              window.location.href = "/login?redirect=/dashboard/install";
            }
          })();
        }, []);

        async function handleLogout() {
          try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch (e) {}
          window.location.href = "/login";
        }

        async function handleRegenerate() {
          setGen({ status: "minting" });
          try {
            const res = await fetch("/api/dashboard", {
              method: "POST", credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "regenerate-key" }),
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok || !body.apiKey) {
              if (body.error === "subscription_required") { window.location.href = "/pricing"; return; }
              setGen({ status: "error", error: body.error || ("HTTP " + res.status) });
              return;
            }
            setGen({
              status: "ready",
              apiKey: body.apiKey,
              installCommand: body.installCommand,
              username: body.username || user.username,
            });
          } catch (e) {
            setGen({ status: "error", error: String(e) });
          }
        }

        if (authLoading) return <div className="install-loading"><p>Loading…</p></div>;
        if (!user) return null;

        const username = gen.username || user.username;

        // BYOD command is assembled entirely client-side from the minted key +
        // the user's own domain/CF tokens (typed below) — nothing here is POSTed.
        const byodCmd =
          "curl -fsSL https://livinity.io/install.sh | sudo bash -s -- \\\n" +
          "  --api-key " + (gen.apiKey || "liv_k_YOURKEY") + " \\\n" +
          "  --domain " + (byodDomain.trim() || "<your-domain>") + " \\\n" +
          "  --cf-token " + (cfApiToken.trim() || "<your-cloudflare-api-token>") + " \\\n" +
          "  --cf-tunnel-token " + (cfTunnelToken.trim() || "<your-cloudflare-tunnel-token>");
        // Readiness requires a VALID box address (a real <sub>.<domain> FQDN),
        // not just a non-empty string — otherwise the Copy button would hand the
        // user a command whose --domain is a bare zone (which install rejects).
        const byodReady = !!(splitDomain(byodDomain).ok && cfApiToken.trim() && cfTunnelToken.trim());

        return (
          <div className="install-shell">
            <nav className="install-nav">
              <a href="/dashboard" className="brand">Livinity</a>
              <div className="right">
                <span className="uname">{user.username}</span>
                <a href="/dashboard" className="h-btn ghost" style={{ borderRadius: 8 }}>Back to dashboard</a>
                <button onClick={handleLogout} className="h-btn">Sign out</button>
              </div>
            </nav>

            <header className="install-hero">
              <span className="step-pill">Install</span>
              <h1>Set up <em>your first LivOS.</em></h1>
              <p>{byod ? "Do the one-time Cloudflare setup below, then paste the command on the machine you want to host your server." : "Here's your one-line install command. Paste it on the machine you want to host your server."}</p>
            </header>

            {!user.emailVerified && (
              <div className="warn-card">
                ⚠ Your email isn't verified yet. You can still generate the command, but be sure to confirm your email — some features require it.
              </div>
            )}

            <section className="panel">
              {gen.status === "minting" && (
                <p className="sub" style={{ fontSize: 13 }}>Generating your install command…</p>
              )}

              {gen.status === "error" && (
                <div>
                  <p className="availability err" style={{ marginBottom: 12 }}>✗ Couldn't mint API key — {gen.error}</p>
                  <button className="h-btn" onClick={handleRegenerate}>Retry</button>
                </div>
              )}

              {gen.status === "billing_pending" && (
                <div>
                  <h2>Payment received ✓</h2>
                  <p className="sub" style={{ marginBottom: 14 }}>
                    We're activating your subscription — this usually takes a few seconds.
                    Refresh to pick up your install command, or open your dashboard.
                  </p>
                  <div style={{ display: "flex", gap: 10 }}>
                    <button className="h-btn solid" onClick={() => window.location.reload()}>Refresh</button>
                    <a className="h-btn" href="/dashboard">Go to dashboard</a>
                  </div>
                </div>
              )}

              {gen.status === "exists" && (
                <div>
                  <h2>Install command already minted</h2>
                  <p className="sub">You generated an API key on a previous visit (prefix <code style={{ fontFamily: "var(--font-mono)" }}>{gen.keyPrefix}…</code>). For security, the full key is only shown once — we can't display it again.</p>

                  <div className="warn-card">
                    ⚠ If you still have the install command saved, just paste it on your server — it stays valid. If you lost it, click <strong>Regenerate</strong> to mint a fresh command (the old key will be invalidated, so any machine using it will disconnect).
                  </div>

                  {byod ? (
                    <div className="url-preview" style={{ marginBottom: 14 }}>
                      Runs on <code>your own domain</code> — click Regenerate to rebuild the command with your Cloudflare details.
                    </div>
                  ) : (
                    <div className="url-preview" style={{ marginBottom: 14 }}>
                      Your URL: <code>{"https://" + (gen.username || user.username) + ".livinity.io"}</code>
                    </div>
                  )}

                  <button className="h-btn solid" onClick={handleRegenerate}>Regenerate install command</button>
                </div>
              )}

              {gen.status === "ready" && byod && (
                <CfSetupGuide
                  domain={byodDomain}
                  setDomain={setByodDomain}
                  cfApiToken={cfApiToken}
                  setCfApiToken={setCfApiToken}
                  cfTunnelToken={cfTunnelToken}
                  setCfTunnelToken={setCfTunnelToken}
                  byodCmd={byodCmd}
                  byodReady={byodReady}
                />
              )}

              {gen.status === "ready" && !byod && gen.installCommand && (
                <div>
                  <h2>Run install command</h2>
                  <p className="sub">Paste this on a fresh Ubuntu 24.04 / Debian 12 server. Install provisions Docker, Caddy, PostgreSQL, Redis, and livinityd in one shot (~5–8 min).</p>

                  <div className="warn-card">
                    ⚠ Your API key is shown only once. If you lose it, click <strong>Regenerate</strong> below to mint a new one (the old key will be invalidated).
                  </div>

                  <div className="cmd-box" style={{ marginBottom: 14 }}>
                    <CopyButton text={gen.installCommand} extraClass="copy" />
                    <code>{gen.installCommand}</code>
                  </div>

                  <div className="url-preview" style={{ marginBottom: 22 }}>
                    Your URL: <code>{"https://" + username + ".livinity.io"}</code>
                  </div>

                  <h2 style={{ marginBottom: 12 }}>What happens next</h2>
                  <ol className="next-list">
                    <li><span className="n">1</span><span><code style={{ fontFamily: "var(--font-mono)" }}>install.sh</code> provisions your server (~5–8 min).</span></li>
                    <li><span className="n">2</span><span><code style={{ fontFamily: "var(--font-mono)" }}>cloudflared</code> connects your tunnel automatically — no port forwarding, no public IP needed.</span></li>
                    <li><span className="n">3</span><span>Open <code style={{ fontFamily: "var(--font-mono)" }}>{"https://" + username + ".livinity.io"}</code> — you're done.</span></li>
                  </ol>
                </div>
              )}
            </section>

            <div className="nav-row">
              <button className="h-btn ghost" onClick={() => { window.location.href = "/dashboard?skipFirstRun=1"; }}>Skip for now</button>
              <div className="right">
                {gen.status === "ready" && (
                  <button className="h-btn" onClick={handleRegenerate}>Regenerate key</button>
                )}
                {(gen.status === "ready" || gen.status === "exists") && (
                  <a href="/dashboard" className="h-btn solid">Done — go to dashboard</a>
                )}
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
