<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Set a new password — Livinity</title>
    <meta name="description" content="Choose a new Livinity password." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <style>
      :root { --fp-pad: clamp(28px, 4vw, 64px); }
      html, body { background: var(--bg); }
      .fp-shell { min-height: 100vh; display: flex; flex-direction: column; }
      .fp-stage { flex: 1; display: grid; place-items: center; padding: var(--fp-pad); }
      .fp-card { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 56px 0; }

      .fp-mark {
        width: 56px; height: 56px; border-radius: 50%;
        background: var(--fg);
        margin: 0 auto 22px;
        position: relative;
        animation: fpBreathe 4.5s ease-in-out infinite;
      }
      .fp-mark::after { content: ""; position: absolute; inset: 16px; border-radius: 50%; background: var(--bg); }
      @keyframes fpBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

      .fp-eyebrow {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fg-mute);
        margin-bottom: 14px;
        display: inline-flex; align-items: center; gap: 8px;
      }
      .fp-eyebrow .ic { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }

      .fp-title {
        font-size: clamp(30px, 4vw, 42px);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.05;
        margin: 0 0 12px;
        text-wrap: balance;
        color: var(--fg);
      }
      .fp-title em { font-style: italic; font-family: "Instrument Serif", serif; font-weight: 400; color: var(--fg-mute); }
      .fp-sub {
        font-size: 15px;
        line-height: 1.55;
        color: var(--fg-mute);
        max-width: 38ch;
        margin: 0 auto 36px;
        text-wrap: pretty;
      }

      .fp-field-wrap { width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: left; }
      .fp-field {
        position: relative;
        background: var(--bg-2);
        border: 1px solid transparent;
        border-radius: 12px;
        transition: background .2s, border-color .2s, box-shadow .2s;
      }
      .fp-field:focus-within {
        background: var(--bg);
        border-color: var(--fg);
        box-shadow: 0 0 0 4px rgba(0,0,0,0.06);
      }
      body.dark .fp-field:focus-within { box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
      .fp-field .lbl {
        position: absolute;
        left: 18px; top: 10px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-mute);
        pointer-events: none;
      }
      .fp-field input {
        width: 100%;
        padding: 28px 18px 12px;
        background: transparent;
        border: 0; outline: 0;
        font: 500 16px/1.2 var(--sans);
        color: var(--fg);
        letter-spacing: -0.01em;
      }
      /* room for the reveal toggle so long values don't slide under it */
      .fp-field.has-toggle input { padding-right: 52px; }
      .fp-reveal {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        width: 36px; height: 36px; display: grid; place-items: center;
        background: transparent; border: 0; border-radius: 9px;
        color: var(--fg-mute); cursor: pointer; transition: color .2s, background .2s;
      }
      .fp-reveal:hover { color: var(--fg); background: var(--bg-2); }

      .fp-submit {
        width: 100%;
        padding: 15px;
        background: var(--fg);
        color: var(--bg);
        border: 0;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 500;
        margin-top: 16px;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        transition: transform .2s, opacity .2s;
        cursor: pointer;
      }
      .fp-submit:hover { transform: translateY(-1px); opacity: 0.92; }
      .fp-submit:disabled { opacity: 0.6; cursor: wait; transform: none; }
      body.dark .fp-submit { background: #f5f5f7; color: #050507; }

      .fp-error {
        margin-top: 16px;
        padding: 12px 14px;
        background: rgba(220,38,38,0.07);
        border: 1px solid rgba(220,38,38,0.18);
        border-radius: 10px;
        color: #b91c1c;
        font-size: 13px;
        line-height: 1.45;
        text-align: left;
      }
      body.dark .fp-error { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.22); color: #fca5a5; }

      .fp-bottom {
        margin-top: 26px;
        font-size: 13px;
        color: var(--fg-mute);
      }
      .fp-bottom a { color: var(--fg); font-weight: 500; }
      .fp-bottom a:hover { opacity: 0.7; }

      /* Success state */
      .fp-success-check {
        width: 56px; height: 56px; border-radius: 50%;
        background: rgba(22,163,74,0.12);
        color: #16a34a;
        margin: 0 auto 22px;
        display: grid; place-items: center;
        animation: fpPop 0.4s cubic-bezier(.2,.7,.2,1);
      }
      @keyframes fpPop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const Arrow = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>);
      const Check = () => (<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12l5 5 11-11"/></svg>);
      const Eye = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>);
      const EyeOff = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0112 4c6.5 0 10 7 10 7a17.6 17.6 0 01-3.06 3.94M6.06 6.06A17.6 17.6 0 002 11s3.5 7 10 7a9.1 9.1 0 003.2-.58"/><path d="M1 1l22 22"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>);

      function Nav() {
        return (
          <nav className="nav">
            <div className="container nav-inner">
              <a href="/" className="brand">
                <span className="brand-mark" aria-hidden="true"/>
                <span>Livinity</span>
              </a>
              <div className="nav-links">
                <a href="/#liv">Liv Agent</a>
                <a href="/#apps">App Library</a>
                <a href="/#privacy">Privacy</a>
                <a href="/#hardware">Hardware</a>
                <a href="/#pricing">Pricing</a>
              </div>
              <div className="nav-cta">
                <a className="btn btn-ghost btn-icon" href="https://github.com/utopusc/livinity-io" target="_blank" rel="noreferrer" aria-label="GitHub">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49v-1.71c-2.78.62-3.37-1.36-3.37-1.36-.46-1.17-1.11-1.48-1.11-1.48-.91-.63.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.63-1.36-2.22-.26-4.56-1.13-4.56-5.03 0-1.11.39-2.02 1.03-2.73-.1-.26-.45-1.29.1-2.69 0 0 .84-.27 2.75 1.04A9.4 9.4 0 0112 6.84c.85 0 1.71.12 2.51.34 1.91-1.31 2.75-1.04 2.75-1.04.55 1.4.2 2.43.1 2.69.64.71 1.03 1.62 1.03 2.73 0 3.91-2.34 4.77-4.57 5.02.36.32.68.94.68 1.89v2.8c0 .27.18.59.69.49A10.05 10.05 0 0022 12.25C22 6.58 17.52 2 12 2z"/></svg>                </a>
                <span className="nav-signin">
                  Remembered? <a href="/login" style={{ color: "var(--fg)", fontWeight: 500 }}>Sign in</a>
                </span>
              </div>
            </div>
          </nav>
        );
      }

      // The reset token rides in on ?token=… (set by the email link in lib/email.ts:
      // `${BASE_URL}/reset-password?token=${token}`). The API verifies it against
      // password_reset_token / _expires, so we just forward it untouched.
      function getToken() {
        try { return new URLSearchParams(window.location.search).get("token"); }
        catch { return null; }
      }

      function App() {
        const [token] = useState(getToken);
        const [password, setPassword] = useState("");
        const [confirm, setConfirm] = useState("");
        const [show, setShow] = useState(false);
        const [submitting, setSubmitting] = useState(false);
        const [error, setError] = useState(null);
        const [done, setDone] = useState(false);

        const handleSubmit = async (e) => {
          if (e) e.preventDefault();
          setError(null);
          if (!password || !confirm) { setError("Please fill in both fields."); return; }
          if (password.length < 8) { setError("Password must be at least 8 characters."); return; }
          if (password !== confirm) { setError("Passwords don't match."); return; }
          setSubmitting(true);
          try {
            const res = await fetch("/api/auth/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ token, password }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              setError(data.error || "Couldn't reset your password.");
              setSubmitting(false);
              return;
            }
            setDone(true);
          } catch (err) {
            setError("Network error. Try again.");
            setSubmitting(false);
          }
        };

        // No token in the URL → the link is malformed/old. Mirror the API's own
        // "invalid or expired" wording and point back to the request flow.
        if (!token) {
          return (
            <>
              <Nav/>
              <div className="fp-shell">
                <main className="fp-stage">
                  <div className="fp-card">
                    <div className="fp-mark"/>
                    <div className="fp-eyebrow"><span className="ic"/> Invalid reset link</div>
                    <h1 className="fp-title">This link's <em>not valid.</em></h1>
                    <p className="fp-sub">
                      The reset link is missing or malformed. Request a fresh one and we'll email it over.
                    </p>
                    <a className="fp-submit" href="/forgot-password" style={{ textDecoration: "none" }}>
                      Request a new link <Arrow/>
                    </a>
                    <div className="fp-bottom">
                      Remembered it? <a href="/login">Sign in</a>
                    </div>
                  </div>
                </main>
              </div>
            </>
          );
        }

        return (
          <>
            <Nav/>
            <div className="fp-shell">
              <main className="fp-stage">
                <div className="fp-card">
                  {done ? (
                    <>
                      <div className="fp-success-check"><Check/></div>
                      <div className="fp-eyebrow"><span className="ic"/> Password updated</div>
                      <h1 className="fp-title">You're <em>all set.</em></h1>
                      <p className="fp-sub">
                        Your password's been changed and every other session was signed out.
                        Sign in with your new password.
                      </p>
                      <a className="fp-submit" href="/login" style={{ textDecoration: "none" }}>
                        Back to sign in <Arrow/>
                      </a>
                    </>
                  ) : (
                    <form onSubmit={handleSubmit} noValidate style={{ width: "100%" }}>
                      <div className="fp-mark"/>
                      <div className="fp-eyebrow"><span className="ic"/> Choose a new password</div>
                      <h1 className="fp-title">Set a <em>new password.</em></h1>
                      <p className="fp-sub">
                        Pick something strong — at least 8 characters. You'll use it to sign in next time.
                      </p>

                      <div className="fp-field-wrap">
                        <div className="fp-field has-toggle">
                          <span className="lbl">New password</span>
                          <input
                            type={show ? "text" : "password"}
                            placeholder="••••••••"
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            autoComplete="new-password"
                            minLength={8}
                            autoFocus
                          />
                          <button
                            type="button"
                            className="fp-reveal"
                            onClick={() => setShow((v) => !v)}
                            aria-label={show ? "Hide password" : "Show password"}
                          >
                            {show ? <EyeOff/> : <Eye/>}
                          </button>
                        </div>
                        <div className="fp-field">
                          <span className="lbl">Confirm password</span>
                          <input
                            type={show ? "text" : "password"}
                            placeholder="••••••••"
                            value={confirm}
                            onChange={(e) => setConfirm(e.target.value)}
                            autoComplete="new-password"
                            minLength={8}
                          />
                        </div>
                      </div>

                      {error && <div className="fp-error" role="alert">{error}</div>}

                      <button type="submit" className="fp-submit" disabled={submitting}>
                        {submitting ? "Resetting…" : "Reset password"}
                        {!submitting && <Arrow/>}
                      </button>

                      <div className="fp-bottom">
                        Remembered it? <a href="/login">Sign in</a>
                      </div>
                    </form>
                  )}
                </div>
              </main>
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
  </body>
</html>
