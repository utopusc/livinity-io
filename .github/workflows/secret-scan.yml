name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scan the working tree (no git history): blocks NEW secrets (liv_k_ keys, tunnel
      # tokens, private keys, default ruleset) without going red on already-known historical
      # leaks that the Phase 1 history purge handles. --redact keeps secrets out of CI logs.
      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1
