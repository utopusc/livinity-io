# Livinity secret-scan config — consumed by .github/workflows/secret-scan.yml
#
# Forward-looking gate: it scans the WORKING TREE (gitleaks `dir`, no git history) so it
# blocks NEW secrets without going permanently red on the historical leaks that the
# Phase 1 history purge removes separately. Run `gitleaks dir . --config .gitleaks.toml`
# locally before pushing.
title = "Livinity secret scan"

[extend]
useDefault = true

[[rules]]
id = "livinity-api-key"
description = "Livinity API key (liv_k_…)"
regex = '''liv_k_[A-Za-z0-9_-]{16,}'''
keywords = ["liv_k_"]

[[rules]]
id = "cloudflare-tunnel-token"
description = "Cloudflare tunnel token (base64 JSON, eyJhIjoi…)"
regex = '''eyJhIjoi[A-Za-z0-9+/=_-]{30,}'''
keywords = ["eyJhIjoi"]

# Synthetic test fixtures / placeholders only — verified non-live (e.g. "_synthetic_for_smoke",
# "serviceToken_xxxxx", all-A padding, "supersecretvalue"). Real credentials must NEVER live in
# tracked source: a liv_k_ match in non-test code outside these allowances is treated as a real
# leak and fails CI. All current tracked liv_k_ values live in test files or the smoke script.
[allowlist]
description = "Known synthetic test fixtures / placeholders (not live credentials)"
paths = [
  '''.*\.test\.(ts|js|mjs)$''',
  '''.*/__tests__/.*''',
  '''.*\.test\.sh$''',
  '''livos/packages/livinityd/scripts/smoke-tunnel-presence\.mjs''',
]
regexes = [
  '''liv_k_AAAA[A-Za-z0-9]*''',                       # all-A padding fixture
  '''liv_k_[A-Za-z0-9_]*synthetic[A-Za-z0-9_]*''',    # *_synthetic_* fixtures
  '''liv_k_[0-9]{3}[A-Z]_serviceToken[A-Za-z0-9_]*''', # 256D/257A serviceToken fixtures
  '''liv_k_super[A-Za-z0-9_-]*''',                    # supersecretvalue… fixture
  '''liv_k_iCCxIa7vlFgbpOl-fPwd''',                   # api-key / heartbeat test fixture
  '''liv_k_lF6WvENQcoYRTaoJhWWU''',                   # env-file / is-authenticated test fixture
  '''eyJhIjoiZmFr[A-Za-z0-9+/=_-]*''',                # {"a":"fake-cf-tunnel-token…"} test fixture
]
