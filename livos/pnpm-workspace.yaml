packages:
  - packages/ui
  - packages/ui-next
  - packages/ui-kit
  - packages/livinityd
  - packages/config
  - packages/docker-agent
  - packages/design-tokens
  - packages/cli
  - packages/liv-ai-app

# pnpm v11+ reads `overrides` from pnpm-workspace.yaml (NOT package.json.pnpm).
# When it lived only in package.json, pnpm 11 computed expected-overrides={}
# while the lockfile recorded {zod:^3.25.0} → ERR_PNPM_LOCKFILE_CONFIG_MISMATCH
# aborted every fresh `--frozen-lockfile` install (UAT 252 G1). Kept in sync
# with package.json.pnpm.overrides for pnpm 10 (local-dev) compatibility.
overrides:
  zod: ^3.25.0

# pnpm v11+ reads settings from pnpm-workspace.yaml, NOT `.npmrc` / package.json.
# `baileys` (Phase 25 WhatsApp) pulls `libsignal` as a git-repository subdep,
# which pnpm's default supply-chain gate (`blockExoticSubdeps`) refuses with
# ERR_PNPM_EXOTIC_SUBDEP → `pnpm install failed` → install.sh exit 1. The old
# fix wrote `block-exotic-subdeps=false` to /opt/livos/.npmrc (deploy-livinityd.sh
# 104-13), but pnpm 11 (installed by `npm i -g pnpm@latest`) IGNORES that .npmrc
# key — every fresh Pro/BYOD box install aborted here until this moved to the
# workspace file, mirroring the overrides + allowBuilds migrations above.
blockExoticSubdeps: false

# pnpm v11+ uses `allowBuilds` map (booleans) at workspace root, NOT the
# legacy `onlyBuiltDependencies` list. Without explicit `true` values for
# every postinstall-needing dep, fresh installs hit ERR_PNPM_IGNORED_BUILDS
# = exit 1 and abort install.sh. Keep the lower-case form (kebab + at-scoped
# quoted) to match what `pnpm approve-builds` interactive picker would write.
# UAT 252 G2: added @google/genai, koffi, openclaw, tree-sitter-bash, workerd
# (these were ignored → exit 1 on a fresh pnpm-11 install).
allowBuilds:
  "@google/genai": true
  "@parcel/watcher": true
  "@swc/core": true
  baileys: true
  core-js: true
  core-js-pure: true
  cpu-features: true
  drivelist: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  node-git-server: true
  node-pty: true
  openclaw: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter-bash: true
  usocket: true
  workerd: true
