<!doctype html>
<html class="h-full min-h-full">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f8f9fc" />
		<!-- PWA: standalone mode. `mobile-web-app-capable` is the modern
		     cross-browser name; the `apple-` variant is kept for older iOS
		     Safari that still only honors the Apple-prefixed tag. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Livinity" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />

		<!-- 2026-05-15 — SVG favicon (Livinity donut mark) takes priority over
		     the legacy PNG family; the .ico path stays as a fallback. -->
		<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
		<title>Livinity</title>
	</head>
	<!-- 2026-05-15: dropped the inline `style="background:#f8f9fc; color:rgba(15,23,42,0.92)"`
	     because inline styles outrank the @apply text-text-primary on body in
	     index.css. With the token wired to var(--text-primary), the body color
	     was getting locked to the light-theme value even in dark mode — every
	     text node that inherits its colour (button labels, list rows, etc.)
	     then read as black on a tinted-light hover background. Pre-paint colour
	     comes from index.css now. -->
	<body class="h-full min-h-full">
		<noscript>
			<h1>LivOS</h1>
			<p>You need to enable JavaScript to run this app.</p>
		</noscript>
		<div id="root" class="h-full min-h-full"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
