<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@livinity/design-tokens — smoke test</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../fonts.css" />
    <style>
      body {
        margin: 0;
        padding: var(--dash-pad);
        background: var(--card-bg);
        color: #111;
        font-family: "Geist", system-ui, sans-serif;
        font-weight: 400;
        line-height: 1.5;
      }
      h1 {
        color: var(--accent-blue);
        font-size: 32px;
        font-weight: 600;
        margin: 0 0 var(--dash-pad) 0;
      }
      .row {
        background: var(--card-bg-2);
        border: 1px solid var(--dash-line);
        border-radius: var(--dash-radius);
        padding: var(--dash-pad);
        margin-bottom: 16px;
        box-shadow: var(--card-shadow);
      }
      .row .label {
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent-green);
        margin-bottom: 8px;
      }
      .row .sans-sample {
        font-family: "Geist", system-ui, sans-serif;
        font-size: 22px;
        font-weight: 500;
      }
      .row .mono-sample {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 18px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .row .serif-sample {
        font-family: "Instrument Serif", serif;
        font-size: 28px;
        font-style: italic;
        font-weight: 400;
      }
      .row .accent-row {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }
      .pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .pill.blue { background: var(--accent-blue); color: white; }
      .pill.green { background: var(--accent-green); color: white; }
      .pill.amber { background: var(--accent-amber); color: white; }
      .pill.red { background: var(--accent-red); color: white; }
    </style>
  </head>
  <body>
    <h1>@livinity/design-tokens — smoke test</h1>

    <div class="row">
      <div class="label">Sans · Geist</div>
      <div class="sans-sample">The quick brown fox jumps over the lazy dog.</div>
    </div>

    <div class="row">
      <div class="label">Mono · Geist Mono</div>
      <div class="mono-sample">livos.packages.design-tokens v1.0.0</div>
    </div>

    <div class="row">
      <div class="label">Serif · Instrument Serif (italic)</div>
      <div class="serif-sample">A single visual identity, end to end.</div>
    </div>

    <div class="row">
      <div class="label">Accent palette</div>
      <div class="accent-row">
        <span class="pill blue">blue</span>
        <span class="pill green">green</span>
        <span class="pill amber">amber</span>
        <span class="pill red">red</span>
      </div>
    </div>
  </body>
</html>
